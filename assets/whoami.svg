  <text x="500" y="22" font-size="12" fill="#6e7681" text-anchor="middle">whoami.py</text><text x="28" y="66" font-size="12" fill="#30363d"> 1</text><text x="64" y="66" font-size="14"><tspan fill="#ff7b72">from</tspan><tspan fill="#c9d1d9"> spectatr </tspan><tspan fill="#ff7b72">import</tspan><tspan fill="#c9d1d9"> Engineer, ship</tspan></text><text x="28" y="89" font-size="12" fill="#30363d"> 2</text><text x="64" y="89" font-size="14"></text><text x="28" y="112" font-size="12" fill="#30363d"> 3</text><text x="64" y="112" font-size="14"><tspan fill="#6e7681"># four years, one company, five jobs</tspan></text><text x="28" y="135" font-size="12" fill="#30363d"> 4</text><text x="64" y="135" font-size="14"><tspan fill="#c9d1d9">ujjwal</tspan><tspan fill="#ff7b72"> = </tspan><tspan fill="#79c0ff">Engineer</tspan><tspan fill="#c9d1d9">(</tspan></text><text x="28" y="158" font-size="12" fill="#30363d"> 5</text><text x="64" y="158" font-size="14"><tspan fill="#c9d1d9">    role</tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#e3b341">"data scientist + ai engineer"</tspan><tspan fill="#c9d1d9">,</tspan></text><text x="28" y="181" font-size="12" fill="#30363d"> 6</text><text x="64" y="181" font-size="14"><tspan fill="#c9d1d9">    company</tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#e3b341">"spectatr.ai"</tspan><tspan fill="#c9d1d9">,</tspan></text><text x="28" y="204" font-size="12" fill="#30363d"> 7</text><text x="64" y="204" font-size="14"><tspan fill="#c9d1d9">    started_in</tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#e3b341">"operations"</tspan><tspan fill="#c9d1d9">,  </tspan><tspan fill="#6e7681"># no ml background</tspan></text><text x="28" y="227" font-size="12" fill="#30363d"> 8</text><text x="64" y="227" font-size="14"><tspan fill="#c9d1d9">    owns</tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#c9d1d9">[</tspan><tspan fill="#e3b341">"swiftlist"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#e3b341">"pulse evals"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#e3b341">"paipai"</tspan><tspan fill="#c9d1d9">],</tspan></text><text x="28" y="250" font-size="12" fill="#30363d"> 9</text><text x="64" y="250" font-size="14"><tspan fill="#c9d1d9">    rule</tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#e3b341">"evals first, vibes second"</tspan><tspan fill="#c9d1d9">,</tspan></text><text x="28" y="273" font-size="12" fill="#30363d">10</text><text x="64" y="273" font-size="14"><tspan fill="#c9d1d9">)</tspan></text><text x="28" y="296" font-size="12" fill="#30363d">11</text><text x="64" y="296" font-size="14"></text><text x="28" y="319" font-size="12" fill="#30363d">12</text><text x="64" y="319" font-size="14"><tspan fill="#79c0ff">ship</tspan><tspan fill="#c9d1d9">(ujjwal, until</tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#e3b341">"it works for a paying customer"</tspan><tspan fill="#c9d1d9">)</tspan></text><rect x="64" y="327" width="8" height="3" fill="#7ee787"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
