<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="career: operations 2021, data analyst 2023, data scientist 2024, ai engineer 2025, product owner 2026" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" xml:space="preserve">
<rect x="0.5" y="0.5" width="999" height="209" rx="10" fill="#0b0f14" stroke="#30363d"/><text x="28" y="34" font-size="12" fill="#6e7681">$ git log --career --oneline   # same company, five jobs</text><line x1="100" y1="100" x2="900" y2="100" stroke="#30363d" stroke-width="2"/><line x1="100" y1="100" x2="900" y2="100" stroke="#7ee787" stroke-width="2" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/></line><text x="100" y="76" font-size="13" fill="#6e7681" text-anchor="middle">2021</text><circle cx="100" cy="100" r="9" fill="#0b0f14" stroke="#6e7681" stroke-width="3"/>
      <circle cx="100" cy="100" r="3.5" fill="#6e7681"/><text x="100" y="140" font-size="15" font-weight="700" fill="#c9d1d9" text-anchor="middle">operations</text><text x="100" y="162" font-size="11.5" fill="#6e7681" text-anchor="middle">respect the plumbing</text><text x="300" y="76" font-size="13" fill="#6e7681" text-anchor="middle">2023</text><circle cx="300" cy="100" r="9" fill="#0b0f14" stroke="#79c0ff" stroke-width="3"/>
      <circle cx="300" cy="100" r="3.5" fill="#79c0ff"/><text x="300" y="140" font-size="15" font-weight="700" fill="#79c0ff" text-anchor="middle">data analyst</text><text x="300" y="162" font-size="11.5" fill="#6e7681" text-anchor="middle">solo analyst, whole company</text><text x="500" y="76" font-size="13" fill="#6e7681" text-anchor="middle">2024</text><circle cx="500" cy="100" r="9" fill="#0b0f14" stroke="#e3b341" stroke-width="3"/>
      <circle cx="500" cy="100" r="3.5" fill="#e3b341"/><text x="500" y="140" font-size="15" font-weight="700" fill="#e3b341" text-anchor="middle">data scientist</text><text x="500" y="162" font-size="11.5" fill="#6e7681" text-anchor="middle">fraud detection, saved lakhs</text><text x="700" y="76" font-size="13" fill="#6e7681" text-anchor="middle">2025</text><circle cx="700" cy="100" r="9" fill="#0b0f14" stroke="#ff7b72" stroke-width="3"/>
      <circle cx="700" cy="100" r="3.5" fill="#ff7b72"/><text x="700" y="140" font-size="15" font-weight="700" fill="#ff7b72" text-anchor="middle">ai engineer</text><text x="700" y="162" font-size="11.5" fill="#6e7681" text-anchor="middle">pulse: 10× faster clips</text><text x="900" y="76" font-size="13" fill="#6e7681" text-anchor="middle">2026</text><circle cx="900" cy="100" r="10" fill="none" stroke="#7ee787">
        <animate attributeName="r" values="10;22" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="900" cy="100" r="9" fill="#0b0f14" stroke="#7ee787" stroke-width="3"/>
      <circle cx="900" cy="100" r="3.5" fill="#7ee787"/><text x="900" y="140" font-size="15" font-weight="700" fill="#7ee787" text-anchor="middle">product owner</text><text x="900" y="162" font-size="11.5" fill="#6e7681" text-anchor="middle">swiftlist, end to end</text>
